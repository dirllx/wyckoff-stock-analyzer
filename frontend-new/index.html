<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>威科夫股票分析系统</title>
  <link rel="stylesheet" href="/src/styles/main.css">
  <link rel="stylesheet" href="/src/styles/layout.css">
  <link rel="stylesheet" href="/src/styles/chart.css">
  <link rel="stylesheet" href="/src/styles/table.css">
  <link rel="stylesheet" href="/src/styles/kline-table.css">
  <link rel="stylesheet" href="/src/styles/watchlist.css">
  <link rel="stylesheet" href="/src/styles/signals.css">
  <link rel="stylesheet" href="/src/styles/multiTimeframe.css">
  <link rel="stylesheet" href="/src/styles/prediction.css">
  <link rel="stylesheet" href="/src/styles/settings.css">
  <link rel="stylesheet" href="/src/styles/health.css">
  <link rel="stylesheet" href="/src/styles/patterns.css">
  <link rel="stylesheet" href="/src/styles/patterns-history.css">
  <link rel="stylesheet" href="/src/styles/notifications.css">
  <link rel="stylesheet" href="/src/styles/riskManagement.css">
  <link rel="stylesheet" href="/src/styles/themes.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1>威科夫股票分析系统</h1>
      <div class="header-actions">
        <button id="theme-toggle" class="header-btn" title="切换主题">🌙</button>
        <button id="settings-btn" class="header-btn" title="设置">⚙️</button>
      </div>
    </header>

    <!-- 股票输入区域 -->
    <div class="stock-input-bar">
      <input type="text" id="stock-code" placeholder="输入股票代码（如 000001）" autocomplete="off">
      <button id="analyze-btn" class="btn-primary">分析</button>
      <button id="add-watchlist-btn" class="btn-secondary" title="加入自选">+ 自选</button>
    </div>

    <!-- 标签页导航 -->
    <nav class="tab-nav">
      <button class="tab-btn active" data-tab="analysis">日分析</button>
      <button class="tab-btn" data-tab="multi">多周期</button>
      <button class="tab-btn" data-tab="watchlist">我的关注</button>
      <button class="tab-btn" data-tab="settings">系统配置</button>
      <button class="tab-btn" data-tab="health">测试状态</button>
    </nav>

    <!-- 标签页内容 -->
    <main class="tab-content">
      <!-- 日分析标签页 -->
      <section id="tab-analysis" class="tab-panel active">
        <div class="analysis-layout">
          <div class="chart-area">
            <div id="mainChart" class="chart-container"></div>
            <div id="volumeChart" class="chart-container chart-small"></div>
          </div>
          <div class="data-area">
            <div id="analysis" class="analysis-summary"></div>
            <div id="signals" class="signals-panel"></div>
            <div id="prediction" class="prediction-panel"></div>
            <div id="patterns" class="patterns-panel"></div>
          </div>
        </div>
        <div id="klineTable" class="kline-table-area"></div>
      </section>

      <!-- 多周期标签页 -->
      <section id="tab-multi" class="tab-panel">
        <div id="multiTimeframe" class="multi-timeframe-panel"></div>
      </section>

      <!-- 我的关注标签页 -->
      <section id="tab-watchlist" class="tab-panel">
        <div id="watchlist" class="watchlist-panel"></div>
      </section>

      <!-- 系统配置标签页 -->
      <section id="tab-settings" class="tab-panel">
        <div id="settings" class="settings-panel"></div>
        <div id="notifications" class="notifications-panel"></div>
        <div id="risk" class="risk-panel"></div>
      </section>

      <!-- 测试状态标签页 -->
      <section id="tab-health" class="tab-panel">
        <div id="health" class="health-panel"></div>
      </section>
    </main>

    <div id="toast-container"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
