<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#3b82f6">
  <title>威科夫股票分析系统</title>

  <!-- 移动端适配 -->
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">

  <!-- 基础样式 -->
  <link rel="stylesheet" href="/src/styles/main.css">
  <link rel="stylesheet" href="/src/styles/components.css">
  <link rel="stylesheet" href="/src/styles/layout.css">
  <link rel="stylesheet" href="/src/styles/chart.css">
  <link rel="stylesheet" href="/src/styles/table.css">
  <link rel="stylesheet" href="/src/styles/kline-table.css">
  <link rel="stylesheet" href="/src/styles/watchlist.css">
  <link rel="stylesheet" href="/src/styles/signals.css">
  <link rel="stylesheet" href="/src/styles/multiTimeframe.css">
  <link rel="stylesheet" href="/src/styles/prediction.css">
  <link rel="stylesheet" href="/src/styles/settings.css">
  <link rel="stylesheet" href="/src/styles/health.css">
  <link rel="stylesheet" href="/src/styles/datasources.css">
  <link rel="stylesheet" href="/src/styles/market.css">
  <link rel="stylesheet" href="/src/styles/patterns.css">
  <link rel="stylesheet" href="/src/styles/notifications.css">
  <link rel="stylesheet" href="/src/styles/riskManagement.css">
  <link rel="stylesheet" href="/src/styles/mobile.css">
</head>
<body>
  <!-- 移动端健康状态栏容器 -->
  <div id="mobile-health-status"></div>

  <div class="card">
    <!-- Tab导航 -->
    <div class="tab-nav">
      <button class="tab-btn active" id="tabAnalyze" data-tab="analyze">📊 分析</button>
      <button class="tab-btn" id="tabMulti" data-tab="multi">📈 多周期</button>
      <button class="tab-btn" id="btnWatchlist" data-tab="watchlist">⭐ 关注</button>
      <button class="tab-btn" id="tabConfig" data-tab="config">⚙️ 配置</button>
      <button class="tab-btn" id="tabStatus" data-tab="status">✅ 状态</button>
    </div>

    <!-- 分析Tab -->
    <div id="tab-analyze" class="tab-content active">
      <div class="form-group" style="margin-top: 0px; margin-bottom: 0px; display: flex; gap: 6px; flex-wrap: nowrap; align-items: center; justify-content: space-between; width: 100%;">
        <!-- 关注列表快速选择按钮 -->
        <button class="btn btn-secondary" id="watchlist-picker-btn" style="padding: 6px 10px; margin-right: 2px; height: 32px; font-weight: 600; font-size: 12px;" title="从关注列表选择">
          ⭐
        </button>

        <input type="text" class="form-input" id="stock-code" value="688234" placeholder="000001" list="stockHistory" style="min-width: 25px; width: 80px; height: 32px; font-weight: 600; font-size: 12px;">
        <datalist id="stockHistory">
          <!-- 历史记录将通过JS动态填充 -->
        </datalist>

        <select class="form-input" id="timeframe" style="min-width: 70px; height: 32px; font-weight: 600; font-size: 12px;">
          <option value="30">30分钟</option>
          <option value="60">60分钟</option>
          <option value="daily" selected>日线</option>
          <option value="weekly">周线</option>
          <option value="monthly">月线</option>
        </select>
        <button class="btn" id="analyze-btn" style="padding: 6px 12px; height: 32px; font-weight: 600; font-size: 12px;">分析</button>
        <button class="btn btn-secondary" id="clear-btn" style="padding: 6px 12px; height: 32px; font-weight: 600; font-size: 12px;">清空</button>
      </div>

      <!-- 图表/表格切换按钮 -->
      <div class="chart-toggle" style="display: flex; gap: 6px; margin: 6px 0;">
        <button class="toggle-btn active" id="btnTable" style="font-weight: 600; height: 32px; font-size: 12px; padding: 6px 12px;">表格</button>
        <button class="toggle-btn" id="btnChart" style="font-weight: 600; height: 32px; font-size: 12px; padding: 6px 12px;">图表</button>
      </div>

      <!-- 表格模式 -->
      <div id="tableMode" style="display: block;"></div>

      <!-- 图表模式 -->
      <div id="chartMode" style="display: none;">
        <!-- 图例说明 -->
        <div style="margin-bottom: 6px; padding: 3px 4px; background: #1f2937; border-radius: 3px; border: 1px solid #374151;">
          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 3px;">
            <!-- 1. 威科夫阶段 -->
            <div>
              <div style="color: #fbbf24; font-size: 9px; font-weight: 600; margin-bottom: 3px; padding-bottom: 2px; border-bottom: 1px solid #374151;">1. 威科夫阶段</div>
              <div style="display: flex; flex-wrap: wrap; gap: 4px; font-size: 8px;">
                <span style="color: #10b981;">▲ U阶段(上升)</span>
                <span style="color: #ef4444;">▼ D阶段(下降)</span>
                <span style="color: #f59e0b;">● A阶段(吸筹)</span>
                <span style="color: #8b5cf6;">● DS阶段(下跌吸筹)</span>
              </div>
            </div>

            <!-- 2. 均线指标 -->
            <div>
              <div style="color: #fbbf24; font-size: 9px; font-weight: 600; margin-bottom: 3px; padding-bottom: 2px; border-bottom: 1px solid #374151;">2. 均线指标</div>
              <div style="display: flex; flex-wrap: wrap; gap: 4px; font-size: 8px;">
                <span style="color: #3b82f6;">─ MA5</span>
                <span style="color: #8b5cf6;">─ MA10</span>
                <span style="color: #10b981;">─ MA20</span>
                <span style="color: #f59e0b;">─ MA60</span>
                <span style="color: #ef4444;">─ MA120</span>
                <span style="color: #eab308; font-weight: 700;">━ MA250</span>
                <span style="color: #f59e0b;">─ 成交量MA5</span>
              </div>
            </div>

            <!-- 3. 异常标识 -->
            <div>
              <div style="color: #fbbf24; font-size: 9px; font-weight: 600; margin-bottom: 3px; padding-bottom: 2px; border-bottom: 1px solid #374151;">3. 异常标识</div>
              <div style="display: flex; flex-wrap: wrap; gap: 4px; font-size: 8px;">
                <span style="color: #10b981; cursor: help;" title="暴涨：单日涨幅≥8%（绿色箭头）">↑ 暴涨</span>
                <span style="color: #ef4444; cursor: help;" title="暴跌：单日跌幅≥8%（红色箭头）">↓ 暴跌</span>
                <span style="color: #3b82f6; cursor: help;" title="突破MA20：向上突破20日均线（蓝色圆圈）">● 突破</span>
                <span style="color: #f97316; cursor: help;" title="跌破MA20：向下突破20日均线（橙色方块）">■ 跌破</span>
                <span style="color: #fbbf24; cursor: help;" title="缩量：成交量低于MA5的50%（黄色小圆）">● 缩量</span>
                <span style="color: #ef4444; cursor: help;" title="异常放量：成交量超过MA5的2倍（红色圆点）">🔥 放量</span>
              </div>
            </div>
          </div>
        </div>

        <!-- K线图 -->
        <div id="mainChart" title="K线图 - 点击分析按钮查看" style="background: #1f2937; border-radius: 8px; padding: 6px; height: 328px; width: 100%; border: 1px solid #374151; margin-bottom: 8px; display:flex; align-items:center; justify-content:center; color:#9ca3af; text-align:center; box-sizing:border-box; cursor: help; min-height: 250px;"></div>

        <!-- 成交量图 -->
        <div id="volumeChart" title="成交量图 - 等待数据" style="background: #1f2937; border-radius: 8px; padding: 6px; height: 84px; width: 100%; border: 1px solid #374151; margin-bottom: 6px; display:flex; align-items:center; justify-content:center; color:#9ca3af; text-align:center; box-sizing:border-box; cursor: help; min-height: 60px;"></div>

        <!-- 图表信息面板 -->
        <div id="chart-info-panel" style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin: 4px 0;">
          <!-- 左：威科夫阶段 -->
          <div id="wyckoff-phase-panel" style="padding: 3px 4px; background: #1f2937; border-radius: 3px; border: 1px solid #374151;">
            <div style="font-size: 8px; color: #9ca3af; margin-bottom: 1px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">威科夫阶段</div>
            <div id="wyckoff-phase-content" style="color: #6b7280; font-size: 9px;">等待分析...</div>
          </div>

          <!-- 中：操作区域 -->
          <div id="operation-zone-panel" style="padding: 3px 4px; background: #1f2937; border-radius: 3px; border: 1px solid #374151;">
            <div style="font-size: 8px; color: #9ca3af; margin-bottom: 1px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">操作区域</div>
            <div id="operation-zone-content" style="color: #6b7280; font-size: 9px;">等待分析...</div>
          </div>

          <!-- 右：预测K线 -->
          <div id="prediction-confidence-panel" style="padding: 3px 4px; background: #1f2937; border-radius: 3px; border: 1px solid #374151;">
            <div style="font-size: 8px; color: #9ca3af; margin-bottom: 1px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">预测K线</div>
            <div id="prediction-confidence" style="color: #6b7280; font-size: 9px;">等待分析...</div>
          </div>
        </div>
      </div>

      <!-- 分析结果区域 -->
      <div id="analyzeResult"></div>
    </div>

    <!-- 多周期Tab -->
    <div id="tab-multi" class="tab-content">
      <!-- 分析控制区 -->
      <div style="padding: 8px; background: #1f2937; border-radius: 8px; margin: 0px 0 0 0; border: 1px solid #374151;">
        <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; justify-content: space-between; width: 100%;">
          <input type="text" class="form-input" id="mtf-stock-code" value="688234" placeholder="股票代码" style="flex: 1; min-width: 120px; max-width: 200px; height: 32px; font-weight: 600; font-size: 12px;">

          <!-- 关注列表快速选择按钮 -->
          <button class="btn btn-secondary" id="mtf-watchlist-picker-btn" style="padding: 6px 12px; height: 32px; font-weight: 600; font-size: 12px;" title="从关注列表选择">
            ⭐ 关注
          </button>

          <div style="display: flex; gap: 6px; align-items: center;">
            <button class="btn" id="mtf-analyze-btn" style="height: 32px; font-weight: 600; font-size: 12px;">🚀 分析</button>
            <button class="btn btn-secondary" id="mtf-clear-btn" style="height: 32px; font-weight: 600; font-size: 12px;">清空</button>
          </div>
        </div>

        <!-- 第二行：日期选择 -->
        <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: space-between; width: 100%;">
          <span style="color: #9ca3af; font-size: 12px; font-weight: 600;">📅 分析日期:</span>
          <select id="mtf-analysis-date" class="form-input" style="flex: 1; min-width: 150px; max-width: 300px; font-weight: 600; font-size: 12px; height: 32px;">
            <option value="">最新数据</option>
            <option value="loading">加载中...</option>
          </select>
          <span style="color: #6b7280; font-size: 11px; font-weight: 600;">选择历史日期进行分析</span>
        </div>
      </div>

      <!-- 加载进度 -->
      <div id="mtf-loading" style="display: none; padding: 20px;">
        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px;">
          <div class="loading">
            <div class="loading-dot"></div>
            <div class="loading-dot"></div>
            <div class="loading-dot"></div>
          </div>
          <div style="color: #10b981; font-size: 14px; font-weight: 600;">正在分析...</div>
        </div>
        <div class="loading-progress-bar">
          <div id="mtf-progress-fill" class="loading-progress-fill" style="width: 0%"></div>
        </div>
        <div id="mtf-loading-steps"></div>
      </div>

      <!-- 多周期结果 -->
      <div id="multiTimeframe" style="padding: 8px;"></div>
    </div>

    <!-- 我的关注Tab -->
    <div id="tab-watchlist" class="tab-content">
      <!-- 主工具栏 -->
      <div style="background: #1f2937; border-radius: 8px; padding: 8px 8px; margin: 0px 0 0 0; border: 1px solid #374151;">
        <!-- 第一行：添加 + 操作按钮 -->
        <div style="display: flex; gap: 6px; align-items: center; margin-bottom: 8px; flex-wrap: wrap;">
          <!-- 添加股票 -->
          <div style="display: flex; gap: 4px; flex: 0 0 auto;">
            <input type="text" class="form-input" id="watchlist-code" placeholder="股票代码" style="min-width: 100px; padding: 6px 10px; font-size: 12px; height: 32px; font-weight: 600;">
            <button class="btn btn-primary" id="add-watchlist-btn" style="padding: 6px 12px; font-size: 12px; height: 32px; font-weight: 600;">➕ 添加</button>
          </div>

          <div style="flex: 1;"></div>

          <!-- 操作按钮 -->
          <div style="display: flex; gap: 6px;">
            <button class="btn btn-secondary" id="batch-import-toggle-btn" style="padding: 6px 12px; font-size: 12px; height: 32px; font-weight: 600;">📥 批量导入</button>
            <button class="btn btn-primary" id="batch-analyze-btn" style="padding: 6px 12px; font-size: 12px; height: 32px; font-weight: 600;">⚡ 批量分析</button>
            <button class="btn btn-warning" id="clear-cache-btn" style="padding: 6px 12px; font-size: 12px; background: linear-gradient(135deg, #f59e0b, #d97706) !important; height: 32px; font-weight: 600;">🗑️ 清缓存</button>
            <button class="btn btn-secondary" id="refresh-watchlist-btn" style="padding: 6px 12px; font-size: 12px; height: 32px; font-weight: 600;">🔄 刷新</button>
          </div>
        </div>

        <!-- 第二行：筛选 -->
        <div id="watchlist-filter-row" style="display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; justify-content: space-between; width: 100%;">
          <span style="color: #9ca3af; font-size: 12px; font-weight: 600;">🎯 筛选:</span>
          <label style="color: #f9fafb; font-size: 12px; display: flex; align-items: center; gap: 4px; cursor: pointer; font-weight: 600;">
            <input type="checkbox" id="filter-bullish" style="width: 14px; height: 14px;">
            <span>只看看涨</span>
          </label>
          <label style="color: #f9fafb; font-size: 12px; display: flex; align-items: center; gap: 4px; cursor: pointer; font-weight: 600;">
            <input type="checkbox" id="filter-bearish" style="width: 14px; height: 14px;">
            <span>只看看跌</span>
          </label>
          <label style="color: #f9fafb; font-size: 12px; display: flex; align-items: center; gap: 4px; cursor: pointer; font-weight: 600;">
            <input type="checkbox" id="filter-high-score" style="width: 14px; height: 14px;">
            <span>评分≥3</span>
          </label>
        </div>

        <!-- 批量导入区域（可折叠） -->
        <div id="batch-import-area" style="display: none; background: #111827; padding: 8px; border-radius: 6px; border: 1px solid #374151; margin-bottom: 6px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <div style="font-size: 12px; font-weight: 600; color: #f9fafb;">📥 批量导入</div>
            <button id="batch-import-close-btn" style="background: none; border: none; color: #9ca3af; font-size: 16px; cursor: pointer;">&times;</button>
          </div>
          <textarea
            id="batch-import-text"
            placeholder="粘贴文本，自动识别股票代码。支持：603520、SH603520、sz300001 或任何包含6位数字的文本"
            style="width: 100%; min-height: 60px; padding: 6px 10px; background: #1f2937; border: 1px solid #374151; border-radius: 6px; color: #f9fafb; font-size: 12px; resize: vertical; margin-bottom: 6px;"
          ></textarea>
          <div style="display: flex; gap: 6px;">
            <button class="btn btn-primary" id="batch-import-preview-btn" style="padding: 6px 12px; font-size: 12px; height: 32px;">🔍 识别</button>
            <button class="btn btn-secondary" id="batch-import-clear-btn" style="padding: 6px 12px; font-size: 12px; height: 32px;">清空</button>
          </div>
          <div id="batch-import-preview" style="display: none; margin-top: 6px;">
            <div style="font-size: 11px; color: #9ca3af; margin-bottom: 4px;">识别到：</div>
            <div id="batch-import-preview-list" style="display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px;"></div>
            <button class="btn btn-primary" id="batch-import-confirm-btn" style="width: 100%; padding: 6px 12px; font-size: 12px; height: 32px;">✅ 确认导入</button>
          </div>
        </div>

        <!-- 第三行：视图切换 + 排序 + 批量选择 + 自选股/浏览股切换 -->
        <div style="display: flex; gap: 6px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; justify-content: space-between; width: 100%;">
          <!-- 视图切换按钮 -->
          <div style="display: flex; gap: 3px;">
            <button id="viewMode-card" class="view-btn" data-view="card" style="padding: 6px 12px; background: #374151; color: #f9fafb; border: 1px solid #4b5563; border-radius: 5px; font-size: 12px; cursor: pointer; font-weight: 600; height: 32px;">
              📇 卡片
            </button>
            <button id="viewMode-table" class="view-btn" data-view="table" style="padding: 6px 12px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: white; border: none; border-radius: 5px; font-size: 12px; cursor: pointer; font-weight: 600; height: 32px;">
              📋 表格
            </button>
          </div>

          <!-- 排序控件（仅卡片视图） -->
          <div id="card-view-sort-controls" style="display: none; gap: 6px; align-items: center;">
            <span style="color: #9ca3af; font-size: 11px; font-weight: 600;">📊 排序:</span>
            <select id="watchlist-sort-select" style="padding: 4px 8px; background: #374151; border: 1px solid #4b5563; color: #f9fafb; border-radius: 4px; font-size: 12px; font-weight: 600; height: 32px;">
              <option value="default">默认</option>
              <option value="score_desc">评分 (高→低)</option>
              <option value="score_asc">评分 (低→高)</option>
              <option value="price_desc">价格 (高→低)</option>
              <option value="price_asc">价格 (低→高)</option>
              <option value="code_asc">代码 (A→Z)</option>
            </select>
          </div>

          <!-- 批量选择控件（仅卡片视图） -->
          <div id="card-view-batch-controls" style="display: none; gap: 6px; align-items: center;">
            <button id="batch-select-toggle-btn" style="padding: 6px 10px; background: #8b5cf6; border: none; color: white; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: 600; height: 32px;">
              ☑️ 批量选择
            </button>
            <button id="batch-delete-btn" style="padding: 6px 10px; background: #dc2626; border: none; color: white; border-radius: 4px; font-size: 11px; cursor: pointer; display: none; font-weight: 600; height: 32px;">
              🗑️ 删除
            </button>
            <span id="filter-stats" style="color: #10b981; font-size: 11px; font-weight: 600;"></span>
          </div>

          <div style="width: 1px; height: 20px; background: #374151; margin: 0 8px;"></div>

          <!-- 自选股 / 浏览股切换 -->
          <button id="subtab-favorite" data-watchlist-tab="favorite" style="padding: 6px 14px; height: 32px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: white; border: none; border-radius: 6px; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: 600;">
            ⭐ 自选股
          </button>
          <button id="subtab-browse" data-watchlist-tab="browse" style="padding: 6px 14px; height: 32px; background: #374151; color: #f9faff; border: none; border-radius: 6px; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: 600;">
            📖 浏览股
          </button>

          <!-- 周期选择器 -->
          <div style="display: flex; align-items: center; gap: 4px; margin-left: 8px;">
            <span style="color: #9ca3af; font-size: 11px; font-weight: 600;">⏰ 周期:</span>
            <select id="watchlist-timeframe" style="padding: 4px 8px; background: #374151; border: 1px solid #4b5563; color: #f9fafb; border-radius: 5px; font-size: 12px; cursor: pointer; font-weight: 600; height: 32px;">
              <option value="30">30分钟</option>
              <option value="60">60分钟</option>
              <option value="daily" selected>日线</option>
              <option value="weekly">周线</option>
              <option value="monthly">月线</option>
            </select>
            <span id="stock-type-indicator" style="color: #10b981; font-size: 10px; margin-left: 6px; padding: 2px 6px; background: #1f2937; border-radius: 4px; border: 1px solid #374151; font-weight: 600;">
              📈 A股
            </span>
          </div>
        </div>
      </div>

      <!-- 关注列表内容 -->
      <div id="watchlist" style="padding: 0 8px 8px 8px;"></div>
    </div>

    <!-- 系统配置Tab -->
    <div id="tab-config" class="tab-content">
      <div id="settings"></div>
      <div id="notifications"></div>
      <div id="risk"></div>
    </div>

    <!-- 测试状态Tab -->
    <div id="tab-status" class="tab-content">
      <div id="health"></div>
    </div>
  </div>

  <div id="toast-container"></div>

  <!-- 关注列表选择弹窗 -->
  <div id="watchlistPickerModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); justify-content: center; align-items: center; z-index: 99999;">

  <script>
