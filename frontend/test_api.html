<!DOCTYPE html>
<html>
<head>
    <title>API地址检测测试</title>
    <meta charset="UTF-8">
</head>
<body>
    <h1>API地址自动检测测试</h1>
    <div id="result"></div>
    
    <script>
        const currentHost = window.location.hostname;
        const API_BASE = `http://${currentHost}:8000`;
        
        document.getElementById('result').innerHTML = `
            <p><strong>当前访问地址:</strong> ${window.location.href}</p>
            <p><strong>检测到主机名:</strong> ${currentHost}</p>
            <p><strong>自动配置API_BASE:</strong> ${API_BASE}</p>
            <p><strong>测试API连接...</strong></p>
        `;
        
        // 测试API连接
        fetch(`${API_BASE}/api/v1/health`)
            .then(response => response.json())
            .then(data => {
                document.getElementById('result').innerHTML += `
                    <p style="color: green;">✓ API连接成功!</p>
                    <p><strong>健康状态:</strong> ${data.status}</p>
                    <p><strong>数据库:</strong> ${data.database}</p>
                `;
            })
            .catch(error => {
                document.getElementById('result').innerHTML += `
                    <p style="color: red;">✗ API连接失败: ${error.message}</p>
                `;
            });
    </script>
</body>
</html>
