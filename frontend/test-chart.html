<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K线图表测试</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.1.1/dist/chartjs-chart-financial.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.umd.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #0a0e27;
            color: #f9fafb;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .card {
            background: #111827;
            border: 1px solid #374151;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .chart-container {
            height: 500px;
            background: #1f2937;
            border-radius: 8px;
            padding: 20px;
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        input, select, button {
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid #374151;
            background: #1f2937;
            color: #f9fafb;
            font-size: 14px;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover {
            background: #2563eb;
        }
        .indicators {
            background: #1f2937;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .indicator-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #374151;
        }
        .indicator-item:last-child {
            border-bottom: none;
        }
        .indicator-name {
            color: #9ca3af;
            font-size: 14px;
        }
        .indicator-value {
            color: #f9fafb;
            font-size: 16px;
            font-weight: 600;
        }
        .bullish { color: #10b981; }
        .bearish { color: #ef4444; }
        .neutral { color: #9ca3af; }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="margin-bottom: 20px;">K线图表测试页面</h1>

        <div class="card">
            <h2 style="margin-bottom: 15px;">数据获取</h2>
            <div class="controls">
                <input type="text" id="stockCode" value="000001" placeholder="股票代码" style="width: 150px;">
                <select id="timeframe">
                    <option value="daily">日线</option>
                    <option value="weekly">周线</option>
                </select>
                <button onclick="loadData()">加载数据</button>
                <button onclick="testApi()">测试API</button>
            </div>
            <div id="status" style="margin-top: 10px; color: #9ca3af; font-size: 14px;">等待操作...</div>
        </div>

        <div class="card" id="chartCard" style="display: none;">
            <h2 style="margin-bottom: 15px;">K线图表</h2>
            <div class="chart-container">
                <canvas id="klineChart"></canvas>
            </div>
        </div>

        <div class="card" id="indicatorsCard" style="display: none;">
            <h2 style="margin-bottom: 15px;">威科夫指标</h2>
            <div class="indicators" id="indicatorsList"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://45.153.246.2:8000';
        let chart = null;
        let currentData = null;

        async function testApi() {
            const code = document.getElementById('stockCode').value;
            const status = document.getElementById('status');

            status.textContent = '正在测试API...';

            try {
                // 测试获取K线数据
                const quotesRes = await fetch(`${API_BASE}/api/v1/stocks/${code}/quotes?timeframe=daily`);
                const quotesData = await quotesRes.json();

                // 测试获取分析结果
                const analysisRes = await fetch(`${API_BASE}/api/v1/stocks/analyze`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code })
                });
                const analysisData = await analysisRes.json();

                status.innerHTML = `
                    <strong>API测试结果：</strong><br><br>
                    K线数据：${quotesData.total}条，状态：${quotesRes.ok ? '✅' : '❌'}<br>
                    分析结果：${analysisData.analysis_summary ? '✅' : '❌'}<br><br>
                    <button onclick="loadData()" style="margin-top: 10px;">显示图表</button>
                `;

                // 保存数据用于显示图表
                currentData = {
                    quotes: quotesData.quotes,
                    analysis: analysisData.analysis_summary
                };

            } catch (error) {
                status.innerHTML = `<strong style="color: #ef4444;">API测试失败：</strong><br>${error.message}`;
            }
        }

        async function loadData() {
            const code = document.getElementById('stockCode').value;
            const timeframe = document.getElementById('timeframe').value;
            const status = document.getElementById('status');

            if (!currentData) {
                status.innerHTML = '<strong style="color: #f59e0b;">请先测试API</strong>';
                return;
            }

            status.textContent = '正在加载图表...';

            try {
                // 显示图表和指标
                document.getElementById('chartCard').style.display = 'block';
                document.getElementById('indicatorsCard').style.display = 'block';

                // 渲染图表
                renderChart(currentData.quotes);

                // 渲染指标
                renderIndicators(currentData.analysis);

                status.textContent = '✅ 图表加载完成！';

            } catch (error) {
                status.innerHTML = `<strong style="color: #ef4444;">加载图表失败：</strong><br>${error.message}`;
            }
        }

        function renderChart(quotes) {
            const ctx = document.getElementById('klineChart').getContext('2d');

            if (chart) {
                chart.destroy();
            }

            // 转换数据格式
            const candlestickData = quotes.map(q => ({
                x: new Date(q.date),
                o: q.open,
                h: q.high,
                l: q.low,
                c: q.close
            }));

            chart = new Chart(ctx, {
                type: 'candlestick',
                data: {
                    datasets: [{
                        label: 'K线',
                        data: candlestickData
                    }, {
                        label: 'MA5',
                        type: 'line',
                        data: quotes.map(q => ({ x: new Date(q.date), y: q.ma5 })),
                        borderColor: 'rgba(59, 130, 246, 0.8)',
                        borderWidth: 1.5,
                        pointRadius: 0,
                        tension: 0.1
                    }, {
                        label: 'MA10',
                        type: 'line',
                        data: quotes.map(q => ({ x: new Date(q.date), y: q.ma10 })),
                        borderColor: 'rgba(139, 92, 246, 0.8)',
                        borderWidth: 1.5,
                        pointRadius: 0,
                        tension: 0.1
                    }, {
                        label: 'MA20',
                        type: 'line',
                        data: quotes.map(q => ({ x: new Date(q.date), y: q.ma20 })),
                        borderColor: 'rgba(245, 158, 11, 0.8)',
                        borderWidth: 1.5,
                        pointRadius: 0,
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    },
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: 'day',
                                tooltipFormat: 'yyyy-MM-dd'
                            },
                            grid: {
                                color: 'rgba(75, 85, 99, 0.2)'
                            },
                            ticks: {
                                color: '#9ca3af'
                            }
                        },
                        y: {
                            grid: {
                                color: 'rgba(75, 85, 99, 0.2)'
                            },
                            ticks: {
                                color: '#9ca3af'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            labels: {
                                color: '#f9fafb'
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const date = new Date(context.parsed.x);
                                    return `${context.dataset.label}: ${context.parsed.y.toFixed(2)} (${date.toLocaleDateString()})`;
                                }
                            }
                        }
                    }
                }
            });
        }

        function renderIndicators(analysis) {
            const container = document.getElementById('indicatorsList');

            if (!analysis || !analysis.details) {
                container.innerHTML = '<div style="text-align: center; color: #9ca3af;">暂无指标数据</div>';
                return;
            }

            const volume = analysis.details.volume || {};
            const sps = analysis.details.sps || {};
            const trend = analysis.details.trend || {};

            container.innerHTML = `
                <div class="indicator-item">
                    <span class="indicator-name">成交量</span>
                    <span class="indicator-value ${volume.direction === 'LONG' ? 'bullish' : volume.direction === 'SHORT' ? 'bearish' : 'neutral'}">${volume.anomaly ? '异常' : '正常'} ${volume.direction || 'NEUTRAL'}</span>
                </div>
                <div class="indicator-item">
                    <span class="indicator-name">OBV趋势</span>
                    <span class="indicator-value ${volume.obv_trend === 'UP' ? 'bullish' : volume.obv_trend === 'DOWN' ? 'bearish' : 'neutral'}">${volume.obv_trend === 'UP' ? '上升' : volume.obv_trend === 'DOWN' ? '下降' : '持平'}</span>
                </div>
                <div class="indicator-item">
                    <span class="indicator-name">SPS位置</span>
                    <span class="indicator-value neutral">${sps.reason || '未知'}</span>
                </div>
                <div class="indicator-item">
                    <span class="indicator-name">支撑位</span>
                    <span class="indicator-value">${sps.support_level ? sps.support_level.toFixed(2) : '-'}</span>
                </div>
                <div class="indicator-item">
                    <span class="indicator-name">阻力位</span>
                    <span class="indicator-value">${sps.resistance_level ? sps.resistance_level.toFixed(2) : '-'}</span>
                </div>
                <div class="indicator-item">
                    <span class="indicator-name">趋势</span>
                    <span class="indicator-value ${trend.direction === 'LONG' ? 'bullish' : trend.direction === 'SHORT' ? 'bearish' : 'neutral'}">${trend.reason || '未知'}</span>
                </div>
                <div class="indicator-item">
                    <span class="indicator-name">信号强度</span>
                    <span class="indicator-value">${analysis.strength || '未知'}</span>
                </div>
                <div class="indicator-item">
                    <span class="indicator-name">评分</span>
                    <span class="indicator-value">${analysis.score || '未知'}</span>
                </div>
                <div class="indicator-item">
                    <span class="indicator-name">置信度</span>
                    <span class="indicator-value">${analysis.confidence ? (analysis.confidence * 100).toFixed(0) + '%' : '未知'}</span>
                </div>
            `;
        }

        // 页面加载时自动测试API
        window.addEventListener('load', () => {
            console.log('页面加载完成，准备测试API');
        });
    </script>
</body>
</html>
