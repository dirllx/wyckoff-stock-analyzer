<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>完整诊断</title>
    <script src="lightweight-charts.standalone.production.js"></script>
    <style>
        body { margin: 20px; background: #0a0e27; color: #fff; font-family: monospace; font-size: 12px; }
        h1 { color: #60a5fa; }
        .section { background: #1f2937; padding: 15px; margin: 10px 0; border-radius: 6px; }
        .ok { color: #10b981; }
        .error { color: #ef4444; }
        .warn { color: #f59e0b; }
        button { background: #3b82f6; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; margin: 5px; }
        button:hover { background: #2563eb; }
        #chart { width: 100%; height: 400px; background: #1a1a2e; margin-top: 10px; }
        pre { background: #111827; padding: 10px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>威科夫系统 - 完整诊断</h1>

    <div class="section">
        <h2>1. 基础检查</h2>
        <div id="basic"></div>
    </div>

    <div class="section">
        <h2>2. 图表库检查</h2>
        <div id="lib"></div>
    </div>

    <div class="section">
        <h2>3. API测试</h2>
        <button onclick="testAPI()">测试API</button>
        <div id="api"></div>
    </div>

    <div class="section">
        <h2>4. K线渲染测试</h2>
        <button onclick="testChart()">测试渲染</button>
        <div id="chart"></div>
        <div id="chartResult"></div>
    </div>

    <script>
        // 1. 基础检查
        const basic = document.getElementById('basic');
        basic.innerHTML = '<span class="ok">✓</span> 页面加载完成';

        // 2. 图表库检查
        const lib = document.getElementById('lib');
        if (typeof window.LightweightCharts !== 'undefined') {
            lib.innerHTML = '<span class="ok">✓</span> LightweightCharts 已加载<br>';
        } else {
            lib.innerHTML = '<span class="error">✗</span> LightweightCharts 未加载<br>';
        }

        // 3. API测试
        async function testAPI() {
            const api = document.getElementById('api');
            api.innerHTML = '测试中...';

            try {
                const res = await fetch('http://localhost:8000/api/v1/stocks/688234/quotes?timeframe=daily&limit=3');
                const data = await res.json();

                api.innerHTML = `
                    <span class="ok">✓</span> API正常<br>
                    数据条数: ${data.total}<br>
                    第一条:<pre>${JSON.stringify(data.quotes[0], null, 2)}</pre>
                `;
            } catch (e) {
                api.innerHTML = `<span class="error">✗</span> 错误: ${e.message}`;
            }
        }

        // 4. 图表渲染测试
        async function testChart() {
            const result = document.getElementById('chartResult');
            result.innerHTML = '开始测试...';

            try {
                result.innerHTML += '<br><span class="ok">✓</span> 步骤1: 开始';

                result.innerHTML += '<br><span class="ok">✓</span> 步骤2: 获取API数据';
                const res = await fetch('http://localhost:8000/api/v1/stocks/688234/quotes?timeframe=daily&limit=10');
                const data = await res.json();

                result.innerHTML += `<br><span class="ok">✓</span> 步骤3: 获取到 ${data.total} 条数据`;

                result.innerHTML += '<br><span class="ok">✓</span> 步骤4: 转换数据格式';
                const chartData = data.quotes.map(q => ({
                    time: q.date.split(' ')[0],
                    open: Number(q.open),
                    high: Number(q.high),
                    low: Number(q.low),
                    close: Number(q.close)
                }));

                result.innerHTML += `<br><span class="ok">✓</span> 步骤5: 转换了 ${chartData.length} 条K线`;
                result.innerHTML += `<br>样例: ${JSON.stringify(chartData[0])}`;

                result.innerHTML += '<br><span class="ok">✓</span> 步骤6: 创建图表';
                const chartDiv = document.getElementById('chart');
                chartDiv.innerHTML = '';

                const chart = LightweightCharts.createChart(chartDiv, {
                    width: chartDiv.clientWidth,
                    height: 400,
                    layout: { background: { color: '#1a1a2e' }, textColor: '#d1d5db' } }
                });

                result.innerHTML += '<br><span class="ok">✓</span> 步骤7: 添加K线系列';
                const series = chart.addCandlestickSeries({
                    upColor: '#10b981',
                    downColor: '#ef4444',
                    borderVisible: false,
                    wickUpColor: '#10b981',
                    wickDownColor: '#ef4444',
                });

                result.innerHTML += '<br><span class="ok">✓</span> 步骤8: 设置数据';
                series.setData(chartData);

                result.innerHTML += '<br><span class="ok">✓</span> 步骤9: 自适应显示';
                chart.timeScale().fitContent();

                result.innerHTML += '<br><span class="ok">✓✓✓ 完成！</span> 如果上方看到K线，说明一切正常！';

            } catch (e) {
                result.innerHTML += `<br><span class="error">✗ 失败: ${e.message}</span>`;
                console.error(e);
            }
        }
    </script>
</body>
</html>
