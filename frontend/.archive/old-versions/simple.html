<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>简化测试</title>
</head>
<body style="background: #111; color: #fff; padding: 20px;">
    <h1 id="title">威科夫股票分析</h1>
    
    <button onclick="showTab()" style="padding: 15px 30px; font-size: 18px;">点击加载关注列表</button>
    
    <div id="watchlist" style="margin-top: 20px; padding: 20px; background: #222;"></div>
    
    <script>
        const API_BASE = 'http://localhost:8000';
        
        async function showTab() {
            document.getElementById('title').innerText = '正在加载...';
            const watchlist = document.getElementById('watchlist');
            watchlist.innerHTML = '加载中...';
            
            try {
                const res = await fetch(API_BASE + '/api/v1/watchlist');
                const data = await res.json();
                
                watchlist.innerHTML = '<h2>✅ 成功！</h2>';
                watchlist.innerHTML += '<p>股票数量: ' + data.total + '</p>';
                
                if (data.items && data.items.length > 0) {
                    watchlist.innerHTML += '<ul>';
                    data.items.forEach(item => {
                        watchlist.innerHTML += '<li>' + item.stock_code + ' - ' + (item.stock_name || '无名称') + '</li>';
                    });
                    watchlist.innerHTML += '</ul>';
                } else {
                    watchlist.innerHTML += '<p>暂无关注股票</p>';
                }
            } catch (err) {
                watchlist.innerHTML = '<h2 style="color: red;">❌ 错误: ' + err.message + '</h2>';
            }
        }
    </script>
</body>
</html>
