<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最小化测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }
        input, select, button {
            padding: 10px;
            margin: 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background: #3b82f6;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background: #2563eb;
        }
        #result {
            margin-top: 20px;
            padding: 10px;
            background: #f9fafb;
            border-radius: 4px;
        }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <div class="container">
        <h1>股票分析最小化测试</h1>
        <div>
            <input type="text" id="stockCode" value="688234" placeholder="股票代码">
            <select id="timeframe">
                <option value="daily">日线</option>
                <option value="weekly">周线</option>
                <option value="monthly">月线</option>
            </select>
            <button onclick="analyzeStock()">开始分析</button>
        </div>
        <div id="result">等待分析...</div>
    </div>

    <script>
        const API_BASE = 'http://45.153.246.2:8000';

        async function analyzeStock() {
            console.log('=== 分析开始 ===');
            const resultDiv = document.getElementById('result');

            const code = document.getElementById('stockCode').value;
            const timeframe = document.getElementById('timeframe').value || 'daily';

            console.log('输入:', { code, timeframe });
            resultDiv.innerHTML = '<p>正在分析...</p>';

            if (!code) {
                resultDiv.innerHTML = '<p class="error">请输入股票代码</p>';
                return;
            }

            try {
                console.log('发送请求...');

                const [quotesRes, analysisRes] = await Promise.all([
                    fetch(`${API_BASE}/api/v1/stocks/${code}/quotes?timeframe=${timeframe}&limit=300`),
                    fetch(`${API_BASE}/api/v1/stocks/analyze`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ code })
                    })
                ]);

                console.log('响应状态:', { quotes: quotesRes.status, analysis: analysisRes.status });

                if (!quotesRes.ok || !analysisRes.ok) {
                    throw new Error('API请求失败');
                }

                const quotesData = await quotesRes.json();
                const analysisData = await analysisRes.json();

                console.log('数据解析成功');
                console.log('K线数量:', quotesData.total);
                console.log('分析结果:', analysisData.analysis_summary);

                resultDiv.innerHTML = `
                    <p class="success">分析成功！</p>
                    <p>股票代码: ${code}</p>
                    <p>时间周期: ${timeframe}</p>
                    <p>K线数据: ${quotesData.total}条</p>
                    <p>分析方向: ${analysisData.analysis_summary.direction}</p>
                    <p>评分: ${analysisData.analysis_summary.score}</p>
                    <p>置信度: ${((analysisData.analysis_summary.confidence || 0) * 100).toFixed(0)}%</p>
                `;

                console.log('=== 分析完成 ===');

            } catch (error) {
                console.error('分析失败:', error);
                resultDiv.innerHTML = `<p class="error">分析失败: ${error.message}</p>`;
            }
        }

        // 页面加载时的日志
        window.addEventListener('DOMContentLoaded', () => {
            console.log('页面加载完成');
            console.log('analyzeStock函数:', typeof analyzeStock);
        });

        // 全局错误捕获
        window.addEventListener('error', (event) => {
            console.error('页面错误:', event.error);
            alert('页面错误: ' + event.error.message);
        });
    </script>
</body>
</html>
