<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>测试 - 威科夫系统</title>
    <script src="lightweight-charts.standalone.production.js"></script>
    <style>
        body {
            margin: 20px;
            background: #0a0e27;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        #mainChart {
            width: 100%;
            height: 500px;
            background: #1a1a2e;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        #volumeChart {
            width: 100%;
            height: 200px;
            background: #1a1a2e;
            border-radius: 8px;
        }
        input, button {
            padding: 8px 12px;
            margin: 5px;
            font-size: 14px;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #2563eb;
        }
        .info {
            padding: 10px;
            background: #1f2937;
            border-radius: 6px;
            margin: 10px 0;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>威科夫系统 - K线测试</h1>

    <div>
        <input type="text" id="stockCode" value="688234" placeholder="股票代码">
        <button onclick="testWithRealData()">加载真实数据</button>
        <button onclick="testWithDummyData()">加载测试数据</button>
    </div>

    <div class="info" id="info">等待操作...</div>

    <div id="mainChart"></div>
    <div id="volumeChart"></div>

    <script>
        const infoDiv = document.getElementById('info');

        function log(msg) {
            console.log(msg);
            infoDiv.innerHTML += '<br>' + msg;
        }

        // 检查图表库
        log('检查图表库: ' + (typeof window.LightweightCharts));

        if (typeof window.LightweightCharts === 'undefined') {
            log('<span style="color:red">✗ 图表库未加载！</span>');
        } else {
            log('<span style="color:green">✓ 图表库已加载</span>');
        }

        async function testWithRealData() {
            infoDiv.innerHTML = '正在获取数据...';
            log('开始获取API数据...');

            try {
                const response = await fetch('http://localhost:8000/api/v1/stocks/688234/quotes?timeframe=daily&limit=500');
                const data = await response.json();

                log('✓ 数据获取成功: ' + data.total + '条');
                renderChart(data.quotes);

            } catch (error) {
                log('<span style="color:red">✗ 错误: ' + error.message + '</span>');
            }
        }

        function testWithDummyData() {
            infoDiv.innerHTML = '加载测试数据...';
            log('使用硬编码测试数据...');

            const dummyData = [
                { date: '2026-03-20 00:00:00', open: 70, high: 75, low: 68, close: 72, volume: 100000 },
                { date: '2026-03-21 00:00:00', open: 72, high: 78, low: 71, close: 76, volume: 120000 },
                { date: '2026-03-22 00:00:00', open: 76, high: 80, low: 74, close: 78, volume: 90000 },
                { date: '2026-03-23 00:00:00', open: 78, high: 82, low: 77, close: 79, volume: 110000 },
                { date: '2026-03-24 00:00:00', open: 79, high: 84, low: 78, close: 83, volume: 130000 },
                { date: '2026-03-25 00:00:00', open: 75, high: 80, low: 74, close: 77, volume: 95000 },
                { date: '2026-03-26 00:00:00', open: 77, high: 80, low: 76, close: 78, volume: 105000 },
            ];

            renderChart(dummyData);
        }

        function renderChart(quotes) {
            log('开始渲染图表...');
            log('原始数据: ' + quotes.length + '条');
            log('第一条原始数据: ' + JSON.stringify(quotes[0]));

            const mainContainer = document.getElementById('mainChart');
            const volumeContainer = document.getElementById('volumeChart');

            if (!mainContainer || !volumeContainer) {
                log('<span style="color:red">✗ 容器未找到！</span>');
                return;
            }

            log('主图容器尺寸: ' + mainContainer.clientWidth + 'x' + mainContainer.clientHeight);

            // 清空容器
            mainContainer.innerHTML = '';
            volumeContainer.innerHTML = '';

            // 创建主图
            const mainChart = LightweightCharts.createChart(mainContainer, {
                width: mainContainer.clientWidth,
                height: 500,
                layout: {
                    background: { color: '#1a1a2e' },
                    textColor: '#d1d5db',
                },
                grid: {
                    vertLines: { color: '#2d3748', style: 1, visible: true },
                    horzLines: { color: '#2d3748', style: 1, visible: true },
                },
            });

            // 准备K线数据
            let candlestickData;
            try {
                candlestickData = quotes.map(q => {
                    // 检查date字段类型
                    let dateStr;
                    if (typeof q.date === 'string') {
                        dateStr = q.date.split(' ')[0];
                    } else if (q.date instanceof Date) {
                        dateStr = q.date.toISOString().split('T')[0];
                    } else {
                        dateStr = String(q.date);
                    }

                    return {
                        time: dateStr,
                        open: Number(q.open),
                        high: Number(q.high),
                        low: Number(q.low),
                        close: Number(q.close)
                    };
                }).filter(d => !isNaN(d.open) && !isNaN(d.high) && !isNaN(d.low) && !isNaN(d.close));

                log('K线数据转换成功: ' + candlestickData.length + '条');
                if (candlestickData.length > 0) {
                    log('第一条K线数据: ' + JSON.stringify(candlestickData[0]));
                }
            } catch (e) {
                log('<span style="color:red">✗ 数据转换失败: ' + e.message + '</span>');
                console.error('数据转换错误:', e);
                return;
            }

            // 添加K线
            try {
                const candleSeries = mainChart.addCandlestickSeries({
                    upColor: '#10b981',
                    downColor: '#ef4444',
                    borderVisible: false,
                    wickUpColor: '#10b981',
                    wickDownColor: '#ef4444',
                });

                candleSeries.setData(candlestickData);
                log('<span style="color:green">✓ K线添加成功</span>');
            } catch (e) {
                log('<span style="color:red">✗ K线添加失败: ' + e.message + '</span>');
                console.error('K线添加错误:', e);
                return;
            }

            // 添加MA线
            const closes = quotes.map(q => q.close);
            const ma5 = calculateMA(closes, 5);
            const ma10 = calculateMA(closes, 10);
            const ma20 = calculateMA(closes, 20);

            const ma5Data = quotes.map((q, i) => ({
                time: q.date.split(' ')[0],
                value: ma5[i]
            })).filter(d => d.value);

            const ma10Data = quotes.map((q, i) => ({
                time: q.date.split(' ')[0],
                value: ma10[i]
            })).filter(d => d.value);

            const ma20Data = quotes.map((q, i) => ({
                time: q.date.split(' ')[0],
                value: ma20[i]
            })).filter(d => d.value);

            if (ma5Data.length > 0) {
                const ma5Series = mainChart.addLineSeries({ color: '#3b82f6', lineWidth: 2 });
                ma5Series.setData(ma5Data);
            }

            if (ma10Data.length > 0) {
                const ma10Series = mainChart.addLineSeries({ color: '#8b5cf6', lineWidth: 2 });
                ma10Series.setData(ma10Data);
            }

            if (ma20Data.length > 0) {
                const ma20Series = mainChart.addLineSeries({ color: '#10b981', lineWidth: 2 });
                ma20Series.setData(ma20Data);
            }

            log('<span style="color:green">✓ MA线添加成功</span>');

            mainChart.timeScale().fitContent();

            // 创建成交量图
            const volumeChart = LightweightCharts.createChart(volumeContainer, {
                width: volumeContainer.clientWidth,
                height: 200,
                layout: {
                    background: { color: '#1a1a2e' },
                    textColor: '#d1d5db',
                },
                grid: {
                    vertLines: { visible: false },
                    horzLines: { color: '#2d3748', style: 1, visible: true },
                },
            });

            const volumeData = quotes.map(q => ({
                time: q.date.split(' ')[0],
                value: Number(q.volume),
                color: Number(q.close) < Number(q.open) ? 'rgba(239, 68, 68, 0.5)' : 'rgba(16, 185, 129, 0.5)',
            }));

            const volumeSeries = volumeChart.addHistogramSeries();
            volumeSeries.setData(volumeData);

            volumeChart.timeScale().fitContent();
            log('<span style="color:green">✓ 成交量添加成功</span>');

            // 同步时间轴
            mainChart.timeScale().subscribeVisibleLogicalRangeChange(range => {
                volumeChart.timeScale().setVisibleLogicalRange(range);
            });

            log('<span style="color:green">✓ 图表渲染完成！</span>');
        }

        function calculateMA(data, period) {
            const result = [];
            for (let i = 0; i < data.length; i++) {
                if (i < period - 1) {
                    result.push(null);
                } else {
                    const sum = data.slice(i - period + 1, i + 1).reduce((a, b) => a + b, 0);
                    result.push(sum / period);
                }
            }
            return result;
        }
    </script>
</body>
</html>
