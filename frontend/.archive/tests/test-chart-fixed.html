<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K线图表测试 - 修复版</title>
    <!-- 使用多个CDN源 -->
    <script src="https://cdn.bootcdn.net/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/luxon/3.4.4/global/luxon.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/chartjs-adapter-luxon/1.3.1/chartjs-adapter-luxon.umd.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/chartjs-chart-financial/0.1.1/chartjs-chart-financial.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #0a0e27;
            color: #f9fafb;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .section {
            background: #111827;
            border: 1px solid #374151;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        button, input, select {
            padding: 12px 20px;
            border-radius: 6px;
            border: 1px solid #374151;
            background: #1f2937;
            color: #f9fafb;
            font-size: 14px;
        }
        button {
            background: #3b82f6;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover {
            background: #2563eb;
        }
        #chart-container {
            background: #1f2937;
            border-radius: 8px;
            padding: 20px;
            height: 500px;
            margin-bottom: 20px;
            border: 1px solid #374151;
        }
        #log-container {
            background: #1f2937;
            border-radius: 8px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            border: 1px solid #374151;
        }
        .status-success {
            color: #10b981;
            font-weight: bold;
            padding: 10px;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 6px;
            margin-bottom: 10px;
            border: 1px solid #10b981;
        }
        .status-error {
            color: #ef4444;
            font-weight: bold;
            padding: 10px;
            background: rgba(239, 68, 68, 0.1);
            border-radius: 6px;
            margin-bottom: 10px;
            border: 1px solid #ef4444;
        }
        .status-info {
            color: #3b82f6;
            font-weight: bold;
            padding: 10px;
            background: rgba(59, 130, 246, 0.1);
            border-radius: 6px;
            margin-bottom: 10px;
            border: 1px solid #3b82f6;
        }
        .log-entry {
            margin-bottom: 5px;
            padding: 5px;
            border-radius: 4px;
            background: rgba(255,255,255,0.05);
        }
        .log-error {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }
        .log-success {
            color: #10b981;
            background: rgba(16, 185, 129, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 威科夫系统 - K线图表修复测试</h1>

        <div class="section">
            <h2>控制面板</h2>
            <div class="controls">
                <input type="text" id="stockCode" value="000001" placeholder="股票代码" style="width: 120px;">
                <select id="timeframe">
                    <option value="daily">日线</option>
                    <option value="weekly">周线</option>
                </select>
                <button onclick="testStep1()">1. 测试API</button>
                <button onclick="testStep2()">2. 加载图表</button>
                <button onclick="clearLogs()">清空日志</button>
                <button onclick="checkLibraries()">检查库加载</button>
            </div>
            <div id="status"></div>
        </div>

        <div class="section">
            <h2>K线图表</h2>
            <div id="chart-container">
                <canvas id="klineChart"></canvas>
                <div id="fallback-chart" style="display: none; text-align: center; padding: 50px; color: #9ca3af;">
                    <h3>📊 图表区域</h3>
                    <p>Canvas未找到，尝试使用纯HTML表格</p>
                    <div id="html-table" style="margin-top: 20px;"></div>
                </div>
            </div>
        </div>

        <div class="section">
            <h2>操作日志</h2>
            <div id="log-container"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://45.153.246.2:8000';
        let chart = null;
        let quotesData = null;
        let analysisData = null;

        // 检查库加载状态
        let chartJsLoaded = false;
        let chartFinancialLoaded = false;
        let luxonLoaded = false;
        let luxonAdapterLoaded = false;

        window.addEventListener('load', () => {
            // 延迟检查库加载状态
            setTimeout(() => {
                chartJsLoaded = typeof Chart !== 'undefined';
                chartFinancialLoaded = typeof ChartFinancial !== 'undefined';
                luxonLoaded = typeof luxon !== 'undefined';
                luxonAdapterLoaded = typeof ChartLuxon !== 'undefined';

                let libraryStatus = [];
                if (!chartJsLoaded) libraryStatus.push('Chart.js未加载');
                if (!chartFinancialLoaded) libraryStatus.push('ChartFinancial插件未加载');
                if (!luxonLoaded) libraryStatus.push('Luxon未加载');
                if (!luxonAdapterLoaded) libraryStatus.push('Luxon适配器未加载');

                if (libraryStatus.length === 0) {
                    log('✅ 所有库加载成功', 'success');
                } else {
                    libraryStatus.forEach(msg => log('⚠ ' + msg, 'error'));
                }

            }, 1000);
        });

        function log(message, type = 'info') {
            const logContainer = document.getElementById('log-container');
            const time = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry log-${type}`;
            logEntry.innerHTML = `[${time}] ${message}`;
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function showStatus(message, type = 'info') {
            const status = document.getElementById('status');
            if (type === 'success') {
                status.innerHTML = `<div class="status-success">✅ ${message}</div>`;
            } else if (type === 'error') {
                status.innerHTML = `<div class="status-error">❌ ${message}</div>`;
            } else {
                status.innerHTML = `<div class="status-info">ℹ ${message}</div>`;
            }
        }

        function checkLibraries() {
            showStatus('正在检查库加载状态...', 'info');
            
            setTimeout(() => {
                const results = {
                    'Chart.js': chartJsLoaded,
                    'ChartFinancial': chartFinancialLoaded,
                    'Luxon': luxonLoaded,
                    'LuxonAdapter': luxonAdapterLoaded
                };

                let allLoaded = Object.values(results).every(v => v === true);

                if (allLoaded) {
                    log('✅ 所有库加载成功', 'success');
                    log('Chart.js: ' + chartJsLoaded, 'info');
                    log('ChartFinancial: ' + chartFinancialLoaded, 'info');
                    showStatus('✅ 所有库加载成功，可以渲染图表', 'success');
                } else {
                    Object.entries(results).forEach(([name, loaded]) => {
                        if (loaded) {
                            log('✅ ' + name + ' 已加载', 'success');
                        } else {
                            log('❌ ' + name + ' 未加载', 'error');
                        }
                    });
                    showStatus('❌ 部分库未加载，请查看浏览器控制台错误', 'error');
                }
            }, 500);
        }

        async function testStep1() {
            const code = document.getElementById('stockCode').value;
            const tfValue = document.getElementById('timeframe').value;
            const timeframe = tfValue || 'daily'; // 确保timeframe有默认值

            log('开始API测试...', 'info');
            log(`股票代码: ${code}`, 'info');
            log(`时间周期: ${timeframe}`, 'info');
            showStatus('正在测试API...', false);

            try {
                // 测试获取K线数据
                const quotesUrl = `${API_BASE}/api/v1/stocks/${code}/quotes?timeframe=${timeframe}`;
                log(`请求URL: ${quotesUrl}`, 'info');
                
                const quotesRes = await fetch(quotesUrl);
                log(`K线响应状态: ${quotesRes.status} ${quotesRes.statusText}`, 'info');
                
                if (!quotesRes.ok) {
                    throw new Error(`K线数据请求失败: ${quotesRes.status}`);
                }

                const quotesData = await quotesRes.json();
                log(`K线数据获取成功: ${quotesData.total}条`, 'success');

                // 测试获取分析结果
                const analysisRes = await fetch(`${API_BASE}/api/v1/stocks/analyze`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code })
                });
                const analysisData = await analysisRes.json();
                log(`分析数据获取成功: ${!!analysisData.analysis_summary}`, 'success');

                // 保存数据
                window.quotesData = quotesData.quotes;
                window.analysisData = analysisData.analysis_summary;

                log('✓ API测试完成，数据已缓存', 'success');
                showStatus('API测试成功，可以加载图表', 'success');

            } catch (error) {
                log('✗ API测试失败: ' + error.message, 'error');
                showStatus('API测试失败: ' + error.message, 'error');
            }
        }

        async function testStep2() {
            if (!window.quotesData || window.quotesData.length === 0) {
                log('✗ 请先完成步骤1（API测试）', 'error');
                showStatus('请先测试API', false);
                return;
            }

            log('开始渲染图表...', 'info');
            showStatus('正在渲染图表...', false);

            try {
                const chartContainer = document.getElementById('chart-container');
                const fallbackChart = document.getElementById('fallback-chart');
                const canvas = document.getElementById('klineChart');

                // 检查Canvas是否存在
                if (!canvas) {
                    log('✗ Canvas元素未找到', 'error');
                    showStatus('Canvas元素未找到', 'error');
                    fallbackChart.style.display = 'block';
                    return;
                }

                // 检查Chart.js是否加载
                if (typeof Chart === 'undefined') {
                    log('✗ Chart.js未加载', 'error');
                    showStatus('Chart.js库未加载', 'error');
                    fallbackChart.style.display = 'block';
                    return;
                }

                if (typeof ChartFinancial === 'undefined') {
                    log('✗ ChartFinancial插件未加载', 'error');
                    showStatus('ChartFinancial插件未加载', 'error');
                    return;
                }

                log('Canvas和Chart.js都正常，开始创建图表', 'info');

                const ctx = canvas.getContext('2d');
                if (!ctx) {
                    throw new Error('无法获取Canvas上下文');
                }

                // 销毁旧图表
                if (chart) {
                    chart.destroy();
                }

                const candlestickData = window.quotesData.map(q => ({
                    x: new Date(q.date),
                    o: q.open,
                    h: q.high,
                    l: q.low,
                    c: q.close
                }));

                log(`准备渲染${candlestickData.length}条K线数据`, 'info');

                chart = new Chart(ctx, {
                    type: 'candlestick',
                    data: {
                        datasets: [{
                            label: 'K线',
                            data: candlestickData
                        }, {
                            label: 'MA5',
                            type: 'line',
                            data: window.quotesData.map(q => ({ x: new Date(q.date), y: q.ma5 })),
                            borderColor: 'rgba(59, 130, 246, 0.8)',
                            borderWidth: 1.5,
                            pointRadius: 0,
                            tension: 0.1
                        }, {
                            label: 'MA10',
                            type: 'line',
                            data: window.quotesData.map(q => ({ x: new Date(q.date), y: q.ma10 })),
                            borderColor: 'rgba(139, 92, 246, 0.8)',
                            borderWidth: 1.5,
                            pointRadius: 0,
                            tension: 0.1
                        }, {
                            label: 'MA20',
                            type: 'line',
                            data: window.quotesData.map(q => ({ x: new Date(q.date), y: q.ma20 })),
                            borderColor: 'rgba(245, 158, 11, 0.8)',
                            borderWidth: 1.5,
                            pointRadius: 0,
                            tension: 0.1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        animation: {
                            duration: 1000
                        },
                        scales: {
                            x: {
                                type: 'time',
                                time: {
                                    unit: 'day',
                                    tooltipFormat: 'yyyy-MM-dd'
                                },
                                grid: {
                                    color: 'rgba(75, 85, 99, 0.2)'
                                },
                                ticks: {
                                    color: '#9ca3af'
                                }
                            },
                            y: {
                                grid: {
                                    color: 'rgba(75, 85, 99, 0.2)'
                                },
                                ticks: {
                                    color: '#9ca3af'
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                display: true,
                                position: 'top',
                                labels: {
                                    color: '#f9fafb'
                                }
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        const date = new Date(context.parsed.x);
                                        return `${context.dataset.label}: ${context.parsed.y.toFixed(2)} (${date.toLocaleDateString()})`;
                                    }
                                }
                            }
                        }
                    }
                });

                log('✓ 图表创建成功', 'success');
                showStatus('图表加载成功！', 'success');
                fallbackChart.style.display = 'none';

            } catch (error) {
                log('✗ 图表加载失败: ' + error.message, 'error');
                log('错误堆栈: ' + error.stack, 'error');
                showStatus('图表加载失败: ' + error.message, 'error');

                // 显示HTML表格作为备用方案
                showHtmlTable();
            }
        }

        function showHtmlTable() {
            const fallbackChart = document.getElementById('fallback-chart');
            const tableContainer = document.getElementById('html-table');
            
            if (!window.quotesData || window.quotesData.length === 0) {
                tableContainer.innerHTML = '<p style="color: #9ca3af;">暂无数据</p>';
                return;
            }

            const headers = ['日期', '开盘', '最高', '最低', '收盘', '成交量', 'MA5', 'MA10', 'MA20'];
            let html = '<table style="width: 100%; border-collapse: collapse; color: #f9fafb;"><thead><tr>';
            headers.forEach(h => html += `<th style="border: 1px solid #374151; padding: 8px; background: #1f2937;">${h}</th>`);
            html += '</tr></thead><tbody>';
            
            window.quotesData.forEach(q => {
                html += '<tr>';
                html += `<td style="border: 1px solid #374151; padding: 8px;">${q.date.split(' ')[0]}</td>`;
                html += `<td style="border: 1px solid #374151; padding: 8px; color: ${q.close > q.open ? '#10b981' : '#ef4444'}">${q.open.toFixed(2)}</td>`;
                html += `<td style="border: 1px solid #374151; padding: 8px;">${q.high.toFixed(2)}</td>`;
                html += `<td style="border: 1px solid #374151; padding: 8px;">${q.low.toFixed(2)}</td>`;
                html += `<td style="border: 1px solid #374151; padding: 8px; color: ${q.close > q.open ? '#10b981' : '#ef4444'}">${q.close.toFixed(2)}</td>`;
                html += `<td style="border: 1px solid #374151; padding: 8px;">${(q.volume/10000).toFixed(0)}万</td>`;
                html += `<td style="border: 1px solid #374151; padding: 8px; color: #3b82f6;">${q.ma5.toFixed(2)}</td>`;
                html += `<td style="border: 1px solid #374151; padding: 8px; color: #8b5cf6;">${q.ma10.toFixed(2)}</td>`;
                html += `<td style="border: 1px solid #374151; padding: 8px; color: #f59e0b;">${q.ma20.toFixed(2)}</td>`;
                html += '</tr>';
            });
            
            html += '</tbody></table>';
            tableContainer.innerHTML = html;
            fallbackChart.style.display = 'block';
            log('✓ HTML表格显示成功（备用方案）', 'success');
        }

        function clearLogs() {
            document.getElementById('log-container').innerHTML = '';
            log('日志已清空', 'info');
        }

        // 页面加载完成后自动检查库
        window.addEventListener('load', () => {
            log('页面加载完成，准备检查库加载状态', 'info');
            setTimeout(checkLibraries, 500);
        });
    </script>
</body>
</html>
