<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统配置测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #0a0e27;
            color: #f9fafb;
        }
        .card {
            background: #111827;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #374151;
        }
        .title { font-size: 18px; margin-bottom: 16px; }
        button {
            padding: 10px 20px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        button:hover { background: #2563eb; }
        .result {
            padding: 12px;
            margin-top: 12px;
            border-radius: 6px;
            font-size: 13px;
            background: #1f2937;
            color: #d1d5db;
            font-family: monospace;
            white-space: pre-wrap;
        }
        .success { color: #10b981; font-weight: 600; }
        .error { color: #ef4444; font-weight: 600; }
    </style>
</head>
<body>
    <div class="card">
        <h1 class="title">系统配置测试</h1>
        <div>
            <button onclick="testLoadPatterns()">1. 测试形态识别配置</button>
            <button onclick="testLoadTimeframes()">2. 测试时间周期配置</button>
        </div>
        <div>
            <button onclick="testLoadFeishu()">3. 测试飞书通知配置</button>
            <button onclick="testLoadRisk()">4. 测试风险监控配置</button>
        </div>
        <div>
            <button onclick="testGetRealtime()">5. 测试实时行情</button>
            <button onclick="testRecognizePatterns()">6. 测试形态识别</button>
        </div>
        
        <div id="result" class="result">点击按钮开始测试...</div>
    </div>

    <script>
        const API_BASE = 'http://45.153.246.2:8000';

        async function testLoadPatterns() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '测试1: 形态识别配置...\n';

            try {
                const response = await fetch(`${API_BASE}/api/v1/config/patterns`);
                const data = await response.json();

                if (data.items && data.items.length > 0) {
                    resultDiv.innerHTML += '✓ 成功：共 ' + data.total + ' 种形态识别配置\n';
                    resultDiv.innerHTML += '配置列表：\n';
                    data.items.forEach((item, i) => {
                        resultDiv.innerHTML += (i+1) + '. ' + item.pattern_type + ' (' + (item.enabled ? '已启用' : '已禁用') + ')\n';
                    });
                    resultDiv.innerHTML += '\n✓ 函数：loadPatternsConfig() 正常工作';
                } else {
                    resultDiv.innerHTML += '✗ 失败：暂无形态识别配置\n';
                    resultDiv.innerHTML += '\n✓ 函数：loadPatternsConfig() 定义正常，但没有数据';
                }
            } catch (error) {
                resultDiv.innerHTML += '✗ 错误：' + error.message + '\n';
                resultDiv.innerHTML += '\n✗ 函数：loadPatternsConfig() 定义异常';
            }
        }

        async function testLoadTimeframes() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '测试2: 时间周期配置...\n';

            try {
                const response = await fetch(`${API_BASE}/api/v1/config/timeframes`);
                const data = await response.json();

                if (data.items && data.items.length > 0) {
                    resultDiv.innerHTML += '✓ 成功：共 ' + data.total + ' 个时间周期配置\n';
                    resultDiv.innerHTML += '配置列表：\n';
                    data.items.forEach((item, i) => {
                        resultDiv.innerHTML += (i+1) + '. ' + item.timeframe + ' (' + (item.enabled ? '已启用' : '已禁用') + ', 优先级: ' + item.priority + ')\n';
                    });
                    resultDiv.innerHTML += '\n✓ 函数：loadTimeframesConfig() 正常工作';
                } else {
                    resultDiv.innerHTML += '✗ 失败：暂无时间周期配置\n';
                    resultDiv.innerHTML += '\n✓ 函数：loadTimeframesConfig() 定义正常，但没有数据';
                }
            } catch (error) {
                resultDiv.innerHTML += '✗ 错误：' + error.message + '\n';
                resultDiv.innerHTML += '\n✗ 函数：loadTimeframesConfig() 定义异常';
            }
        }

        async function testLoadFeishu() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '测试3: 飞书通知配置...\n';

            try {
                const response = await fetch(`${API_BASE}/api/v1/config/feishu`);
                const data = await response.json();

                if (data.webhook_url) {
                    resultDiv.innerHTML += '✓ 成功：飞书通知配置\n';
                    resultDiv.innerHTML += 'Webhook URL: ' + data.webhook_url + '\n';
                    resultDiv.innerHTML += '启用通知: ' + (data.enabled ? '启用' : '禁用') + '\n';
                    resultDiv.innerHTML += '\n✓ 函数：loadFeishuConfig() 正常工作';
                } else {
                    resultDiv.innerHTML += '✗ 失败：暂无飞书通知配置\n';
                    resultDiv.innerHTML += '\n✓ 函数：loadFeishuConfig() 定义正常，但没有数据';
                }
            } catch (error) {
                resultDiv.innerHTML += '✗ 错误：' + error.message + '\n';
                resultDiv.innerHTML += '\n✗ 函数：loadFeishuConfig() 定义异常';
            }
        }

        async function testLoadRisk() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '测试4: 风险监控配置...\n';

            try {
                const response = await fetch(`${API_BASE}/api/v1/config/risk`);
                const data = await response.json();

                if (data.threshold) {
                    resultDiv.innerHTML += '✓ 成功：风险监控配置\n';
                    resultDiv.innerHTML += '风险阈值: ' + data.threshold + '\n';
                    resultDiv.innerHTML += '启用风险监控: ' + (data.enabled ? '启用' : '禁用') + '\n';
                    resultDiv.innerHTML += '风险等级: ' + (data.risk_level || '低') + '\n';
                    resultDiv.innerHTML += '\n✓ 函数：loadRiskConfig() 正常工作';
                } else {
                    resultDiv.innerHTML += '✗ 失败：暂无风险监控配置\n';
                    resultDiv.innerHTML += '\n✓ 函数：loadRiskConfig() 定义正常，但没有数据';
                }
            } catch (error) {
                resultDiv.innerHTML += '✗ 错误：' + error.message + '\n';
                resultDiv.innerHTML += '\n✗ 函数：loadRiskConfig() 定义异常';
            }
        }

        async function testGetRealtime() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '测试5: 实时行情 (688234)...\n';

            try {
                const response = await fetch(`${API_BASE}/api/v1/realtime/quote/688234`);
                const data = await response.json();

                if (data.price) {
                    resultDiv.innerHTML += '✓ 成功：实时行情数据\n';
                    resultDiv.innerHTML += '当前价: ' + data.price + '\n';
                    resultDiv.innerHTML += '涨跌额: ' + (data.change >= 0 ? '+' : '') + data.change + '\n';
                    resultDiv.innerHTML += '涨跌幅: ' + (data.change_percent >= 0 ? '+' : '') + data.change_percent + '%\n';
                    resultDiv.innerHTML += '成交量: ' + (data.volume || 0) + '\n';
                    resultDiv.innerHTML += '更新时间: ' + (data.update_time || '') + '\n';
                    resultDiv.innerHTML += '\n✓ 函数：getRealtimeQuote() 正常工作';
                } else {
                    resultDiv.innerHTML += '✗ 失败：暂无实时行情数据\n';
                    resultDiv.innerHTML += '\n✓ 函数：getRealtimeQuote() 定义正常，但没有数据';
                }
            } catch (error) {
                resultDiv.innerHTML += '✗ 错误：' + error.message + '\n';
                resultDiv.innerHTML += '\n✗ 函数：getRealtimeQuote() 定义异常';
            }
        }

        async function testRecognizePatterns() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '测试6: 形态识别 (688234, 日线)...\n';

            try {
                const response = await fetch(`${API_BASE}/api/v1/stocks/688234/patterns`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ timeframe: 'daily' })
                });
                const data = await response.json();

                if (data.patterns && data.patterns.length > 0) {
                    resultDiv.innerHTML += '✓ 成功：识别到 ' + data.patterns.length + ' 个形态\n';
                    resultDiv.innerHTML += '形态列表：\n';
                    data.patterns.forEach((item, i) => {
                        resultDiv.innerHTML += (i+1) + '. ' + item.pattern + ' (' + (item.type === 'bullish' ? '看涨' : '看跌') + ')\n';
                    });
                    resultDiv.innerHTML += '\n✓ 函数：recognizePatterns() 正常工作';
                } else {
                    resultDiv.innerHTML += '✗ 失败：暂未识别到任何形态\n';
                    resultDiv.innerHTML += '\n✓ 函数：recognizePatterns() 定义正常，但没有数据';
                }
            } catch (error) {
                resultDiv.innerHTML += '✗ 错误：' + error.message + '\n';
                resultDiv.innerHTML += '\n✗ 函数：recognizePatterns() 定义异常';
            }
        }
    </script>
</body>
</html>
