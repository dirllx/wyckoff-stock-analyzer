<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关注列表测试</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #1f2937; color: #f9fafb; }
        .test-section { background: #374151; padding: 20px; margin: 10px 0; border-radius: 8px; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; background: #3b82f6; color: white; border: none; border-radius: 4px; }
        #result { background: #111827; padding: 15px; margin-top: 10px; border-radius: 4px; white-space: pre-wrap; font-family: monospace; }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .info { color: #f59e0b; }
    </style>
</head>
<body>
    <h1>🔧 关注列表诊断工具</h1>
    
    <div class="test-section">
        <h3>测试1: API连接</h3>
        <button onclick="testAPI()">测试API连接</button>
        <div id="result"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';

        async function testAPI() {
            const result = document.getElementById('result');
            result.innerHTML = '<div style="color: #f59e0b;">正在测试...</div>';

            try {
                const response = await fetch(API_BASE + '/api/v1/watchlist');
                const data = await response.json();
                
                result.innerHTML = \`
                    <div class="success">✅ API连接成功！</div>
                    <div>股票数量: \${data.total}</div>
                    <div>股票列表: \${data.items?.map(i => i.stock_code).join(', ') || '无'}</div>
                \`;
            } catch (error) {
                result.innerHTML = \`<div class="error">❌ 连接失败: \${error.message}</div>\`;
            }
        }
    </script>
</body>
</html>
