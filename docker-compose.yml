version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: wyckoff-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wyckoff_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wyckoff-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wyckoff-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/wyckoff.db
      REDIS_URL: redis://redis:6379/0
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DEBUG: "True"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /root/.openclaw/workspace/wyckoff-stock-analyzer/.env:/app/.env
      - /root/.openclaw/workspace/wyckoff-stock-analyzer/wyckoff.db:/app/wyckoff.db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    working_dir: /app

volumes:
  postgres_data:
  redis_data:
