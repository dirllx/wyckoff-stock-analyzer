alerts:
  all_sources_failed: true
  channels:
  - enabled: true
    type: log
  enabled: true
  failure_rate_threshold: 0.5
  response_time_threshold: 3000
global:
  auto_speed_test: true
  enable_stats: true
  speed_test_interval: 3600
  speed_test_timeout: 10
  stats_retention_days: 30
scheduling:
  auto_fallback: true
  cache_ttl: 3600
  enable_cache: true
  max_fallback_attempts: 0
  strategy: priority
sources:
  akshare:
    enabled: true
    name: akshare
    priority: 1
    retry_count: 3
    retry_delay: 1.0
    stats:
      avg_response_time: 0
      failed_requests: 0
      last_failure_time: null
      last_success_time: null
      successful_requests: 0
      total_requests: 0
    supported_timeframes:
    - daily
    - weekly
    - monthly
    - '1'
    - '5'
    - '15'
    - '30'
    - '60'
    timeframe_config:
      daily:
        priority: 1
        timeout: 30
      monthly:
        priority: 3
        timeout: 45
      weekly:
        priority: 3
        timeout: 45
    timeout: 30
  baostock:
    enabled: true
    name: baostock
    priority: 2
    retry_count: 2
    retry_delay: 1.0
    stats:
      avg_response_time: 0
      failed_requests: 0
      last_failure_time: null
      last_success_time: null
      successful_requests: 0
      total_requests: 0
    supported_timeframes:
    - daily
    - weekly
    - monthly
    - '5'
    - '15'
    - '30'
    - '60'
    timeframe_config:
      daily:
        priority: 2
      monthly:
        priority: 1
        timeout: 15
      weekly:
        priority: 1
        timeout: 15
    timeout: 20
  easyquotation:
    enabled: true
    name: easyquotation
    priority: 3
    realtime_only: true
    retry_count: 1
    retry_delay: 0.5
    stats:
      avg_response_time: 0
      failed_requests: 0
      last_failure_time: null
      last_success_time: null
      successful_requests: 0
      total_requests: 0
    supported_timeframes:
    - realtime
    timeout: 10
speed_test:
  enabled: true
  interval: 3600
  min_samples: 3
  response_time_threshold: 5000
  test_stock: '000001'
  test_timeframes:
  - daily
  - weekly
  - monthly
  timeout: 10
timeframe_priority:
  '30':
  - akshare
  - baostock
  '60':
  - akshare
  - baostock
  daily:
  - akshare
  - baostock
  monthly:
  - baostock
  - akshare
  realtime:
  - easyquotation
  - akshare
  weekly:
  - baostock
  - akshare
